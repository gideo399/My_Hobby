{% extends "base.html" %}
{% block title %}Add photo · Frame{% endblock %}
{% block content %}
<section class="auth">
  <h1>Add a photo</h1>
  <p class="lede">JPG, PNG, GIF or WebP, up to 8 MB.</p>
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include "registration/_form_fields.html" %}
    <button type="submit" class="btn">Upload photo</button>
    <a class="alt-link" href="{% url 'gallery' %}">Cancel</a>
  </form>
</section>
{% endblock %}
